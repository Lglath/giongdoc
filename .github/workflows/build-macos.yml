name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to attach DMGs to a GitHub Release on tag pushes

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15   # Apple Silicon
            arch: arm64
            ffarch: arm64
          # macos-13 images were retired by GitHub (Dec 2025); macos-15-intel is the
          # x86_64 replacement. Switch back to macos-13 if your org still has it.
          - os: macos-15-intel   # Intel
            arch: x86_64
            ffarch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download static ffmpeg (no Homebrew dylibs, runs on any Mac)
        run: |
          curl -fsSL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${{ matrix.ffarch }}/release/ffmpeg.zip" -o "$RUNNER_TEMP/ffmpeg.zip"
          unzip -o -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ff"
          chmod +x "$RUNNER_TEMP/ff/ffmpeg"
          otool -L "$RUNNER_TEMP/ff/ffmpeg"
          "$RUNNER_TEMP/ff/ffmpeg" -hide_banner -version | head -n 1
          echo "FFMPEG_SRC=$RUNNER_TEMP/ff/ffmpeg" >> "$GITHUB_ENV"
          echo "STRICT_FFMPEG=1" >> "$GITHUB_ENV"

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .app and .dmg
        env:
          PYTHON: python
          GIONGDOC_VERSION: ${{ steps.ver.outputs.version }}
          # Optional notarization: define these repository secrets to enable it.
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: bash packaging/build_macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiongDoc-${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
